name: Tests

on:
  push:
  pull_request:

jobs:
  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tpot-analyzer/requirements.txt
      - name: Resolve project directory
        run: |
          if [ -f "tpot-analyzer/requirements.txt" ]; then
            echo "PROJECT_DIR=tpot-analyzer" >> "$GITHUB_ENV"
          elif [ -f "requirements.txt" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "Unable to find requirements.txt in project root or tpot-analyzer/" >&2
            exit 1
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${PROJECT_DIR}/requirements.txt"
      - name: Verify Louvain dependency contract
        run: |
          python "${PROJECT_DIR}/scripts/verify_louvain_dependency_contract.py"
      - name: Verify docs hygiene
        run: |
          python "${PROJECT_DIR}/scripts/verify_docs_hygiene.py"
      - name: Verify frontend/backend API contracts
        run: |
          PYTHONPATH="${PROJECT_DIR}" python "${PROJECT_DIR}/scripts/verify_api_contracts.py"
      - name: Verify clusters (fixture, granularity 25)
        run: |
          PYTHONPATH="${PROJECT_DIR}" python "${PROJECT_DIR}/scripts/verify_clusters.py" \
            --base-path "${PROJECT_DIR}/tests/fixtures/medium_graph/graph_snapshot" --granularity 25
      - name: Verify clusters (fixture, granularity 40)
        run: |
          PYTHONPATH="${PROJECT_DIR}" python "${PROJECT_DIR}/scripts/verify_clusters.py" \
            --base-path "${PROJECT_DIR}/tests/fixtures/medium_graph/graph_snapshot" --granularity 40
      - name: Pytest (excluding selenium + supabase-dependent suites)
        # `-m 'not selenium and not requires_supabase'` honours the markers
        # declared in pytest.ini. Selenium tests need a real browser; the
        # supabase tests need a network secret we don't expose in CI.
        run: |
          PYTHONPATH="${PROJECT_DIR}" python -m pytest "${PROJECT_DIR}/tests" \
            -m 'not selenium and not requires_supabase' \
            -q --tb=short --maxfail=20

  public-site:
    name: public-site (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tpot-analyzer/public-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tpot-analyzer/public-site/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Vitest
        run: npx vitest run --reporter=default

  graph-explorer:
    name: graph-explorer (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tpot-analyzer/graph-explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tpot-analyzer/graph-explorer/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Vitest (unit suite only; skip e2e/playwright)
        # graph-explorer includes Playwright e2e under ./e2e — those need
        # a browser and run via `npx playwright test`. CI here covers the
        # vitest unit suite under ./src.
        run: npx vitest run src --reporter=default
