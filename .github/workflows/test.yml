name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tpot-analyzer/requirements.txt
      - name: Resolve project directory
        run: |
          if [ -f "tpot-analyzer/requirements.txt" ]; then
            echo "PROJECT_DIR=tpot-analyzer" >> "$GITHUB_ENV"
          elif [ -f "requirements.txt" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "Unable to find requirements.txt in project root or tpot-analyzer/" >&2
            exit 1
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${PROJECT_DIR}/requirements.txt"
      - name: Verify CI discovery and patch hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python "${PROJECT_DIR}/scripts/verify_ci_discovery.py" --base "${BASE_SHA}"
      - name: Verify Louvain dependency contract
        run: python "${PROJECT_DIR}/scripts/verify_louvain_dependency_contract.py"
      - name: Verify docs hygiene
        run: python "${PROJECT_DIR}/scripts/verify_docs_hygiene.py"
      - name: Verify frontend/backend API contracts
        run: PYTHONPATH="${PROJECT_DIR}" python "${PROJECT_DIR}/scripts/verify_api_contracts.py"
      - name: Verify clusters (fixture, granularity 25)
        run: |
          PYTHONPATH="${PROJECT_DIR}" python "${PROJECT_DIR}/scripts/verify_clusters.py" \
            --base-path "${PROJECT_DIR}/tests/fixtures/medium_graph/graph_snapshot" --granularity 25
      - name: Verify clusters (fixture, granularity 40)
        run: |
          PYTHONPATH="${PROJECT_DIR}" python "${PROJECT_DIR}/scripts/verify_clusters.py" \
            --base-path "${PROJECT_DIR}/tests/fixtures/medium_graph/graph_snapshot" --granularity 40
      - name: Pytest (excluding selenium + supabase-dependent suites)
        # These suites need a real browser or a network secret unavailable in CI.
        run: |
          PYTHONPATH="${PROJECT_DIR}" python -m pytest "${PROJECT_DIR}/tests" \
            -m 'not selenium and not requires_supabase' \
            -q --tb=short --maxfail=20

  public-site:
    name: public-site (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tpot-analyzer/public-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tpot-analyzer/public-site/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Vitest
        run: npx vitest run --reporter=default
      - name: Production build
        run: npm run build

  graph-explorer:
    name: graph-explorer (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tpot-analyzer/graph-explorer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tpot-analyzer/graph-explorer/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Vitest (unit suite only; skip e2e/playwright)
        # Playwright e2e needs a browser; this job covers Vitest under ./src.
        run: npx vitest run src --reporter=default
      - name: Production build
        run: npm run build
